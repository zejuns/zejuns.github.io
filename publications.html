<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/main.css">
	  <title>Publications | Zach</title>
    <style>
      body.light-mode #header:not(.fixed) .logo,
      body.light-mode #header:not(.fixed) .navigation a {
          color: #000;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
    </div>
    <section class="banner" role="banner">
      <div id="header-placeholder"></div>
    </section>
    <main id="swup" class="transition-scale">
      <section id="services" class="services service-section">
        <div class="container">
          <div class="section-header">
              <h3 class="wow fadeInDown animated">My Publications</h3>
              <p class="wow fadeInDown animated"></p>
          </div>
          <div class="row">
            <div class="services">
              <div class="services-content">
                <img src="/files/publications/paper1.webp" alt="">
                <div class="services-text">
                  <h5>Standardizing and Early Warning of Sewing Beginners' Posture Based on CNN Visual Recognition Technology</h5>
                  <p>Zejun Huang, Zhen Qin, Hanze Ge</p>
                  <p>HCII Conference on Innovative Technology for Public Health and Occupational Safety, 2024</p>
                  <a href="/files/publications/Sewing.pdf" data-fancybox data-type="iframe">
                    PDF
                  </a>
                  <span> | </span>
                  <a href="https://github.com/zejuns/sewer-movement-recognition.git" target="_blank">GitHub Repository</a>
                </div>
              </div>

            </div>
          </div>
        </div>
      </section>
    </main> 
    <footer id="footer-placeholder" class="footer-distributed"></footer>
    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>
    <script src="https://unpkg.com/swup@4"></script>
    <script src="/js/main.js"></script> 
    <script>
      // 初始化 Swup
      const swup = new Swup();

      // 执行一次性初始化 (加载页头页脚等)
      function runOneTimeSetup() {
        const headerPromise = loadComponent("#header-placeholder", "/components/header.html");
        const footerPromise = loadComponent("#footer-placeholder", "/components/footer.html");

        headerPromise.then(() => {
          Site.initHeaderComponents();
          Site.setActiveNav(); // 首次加载也需要设置导航状态
        });
      }
      runOneTimeSetup();

      // 首次加载时，初始化页面内容
      Site.initPageContent();

      // 将方法绑定到 Swup 的生命周期钩子
      swup.hooks.on('animation:out:end', Site.cleanupPageContent.bind(Site));
      swup.hooks.on('page:view', Site.initPageContent.bind(Site));
    </script>
  </body>
</html>
